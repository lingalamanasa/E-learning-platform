<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - STACKLY</title>
  <meta name="description" content="Sign in to your STACKLY account and access personalized AI learning pathways, cloud sandboxes, and certifications.">

  <!-- Font Awesome 6.5.1 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="auth-page-body">

  <!-- Ambient Multi-Color Aurora Mesh Orbs & Overlay -->
  <div class="ambient-aurora-container" style="opacity: 0.6;">
    <div class="aurora-orb aurora-orb-violet"></div>
    <div class="aurora-orb aurora-orb-cyan"></div>
    <div class="aurora-orb aurora-orb-coral"></div>
  </div>
  <div class="cyber-grid-overlay" style="opacity: 0.5;"></div>

  <!-- Interactive Constellation Canvas -->
  <canvas id="constellation-canvas"></canvas>

  <div class="auth-split-card slide-up-reveal">
    
    <!-- Left Visual Side -->
    <div class="auth-visual-side">
      <img src="images/login_elearn_theme.webp" alt="E-Learning Student &amp; Skill Progression" class="auth-visual-bg-img" />
      <div class="auth-visual-overlay"></div>
      
      <div class="auth-visual-content">
        <h2 class="auth-visual-title">
          Master any skill with<br>AI-guided learning.
        </h2>
        <p class="auth-visual-desc">
          Join 120,000+ engineers, students, and creators mastering real-world tech on Stackly.
        </p>
      </div>
    </div>

    <!-- Right Form Side -->
    <div class="auth-form-side">
      
      <!-- Back to Home -->
      <div class="auth-back-nav">
        <a href="index.html" class="auth-back-pill">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Back to Home</span>
        </a>
      </div>

      <!-- Brand Logo & Heading -->
      <div class="auth-brand-head">
        <a href="index.html">
          <img src="images/stackly-logo.webp" alt="STACKLY" />
        </a>
        <h1 class="auth-form-heading">Welcome back</h1>
        <p class="auth-form-subtext">Enter your credentials to access your dashboard.</p>
      </div>

      <!-- Form -->
      <form id="login-form">
        
        <div class="auth-field-group">
          <label class="auth-field-label">Email *</label>
          <input type="email" id="auth-email" required value="lingalamanasa123@gmail.com" placeholder="name@company.com" class="auth-field-input" />
        </div>

        <div class="auth-field-group">
          <label class="auth-field-label">Password *</label>
          <div class="auth-password-box">
            <input type="password" id="auth-password" required value="••••••••" placeholder="Enter your password" class="auth-field-input" />
            <button type="button" class="auth-eye-toggle" id="toggle-password" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="auth-field-group">
          <label class="auth-field-label">Role *</label>
          <select id="auth-role" class="auth-field-select" required>
            <option value="" disabled>Select your role</option>
            <option value="user" selected>User (Learner)</option>
            <option value="admin">Admin (Administrator)</option>
          </select>
        </div>

        <!-- Options Row -->
        <div class="auth-options-row">
          <label class="auth-checkbox-label">
            <input type="checkbox" id="remember-me" checked />
            <span>Remember me</span>
          </label>
          <a href="#" class="auth-link-red" onclick="window.showToast && window.showToast('Password reset link dispatched to your email.', 'info'); return false;">
            Forgot password?
          </a>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="auth-btn-dark">
          Sign in
        </button>

      </form>

      <!-- Divider -->
      <div class="auth-or-divider">
        <span>Or continue with</span>
      </div>

      <!-- Social Auth Buttons -->
      <div class="auth-social-buttons">
        <button type="button" class="auth-social-pill" onclick="window.showToast && window.showToast('Apple ID authentication connected.', 'success'); setTimeout(() => window.location.href='user-dashboard.html', 700);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.93-2.85-.9.04-1.99.6-2.64 1.35-.57.65-1.07 1.71-.94 2.73 1 .08 2.03-.48 2.65-1.23z"/></svg>
          <span>Apple</span>
        </button>
        
        <button type="button" class="auth-social-pill" onclick="window.showToast && window.showToast('Google Workspace authentication connected.', 'success'); setTimeout(() => window.location.href='user-dashboard.html', 700);">
          <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
          <span>Google</span>
        </button>
      </div>

      <!-- Switch to Sign Up -->
      <div class="auth-footer-switch">
        <span>Don't have an account?</span>
        <a href="signup.html" class="auth-link-red">Create account</a>
      </div>

      <!-- GitHub Link -->
      <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="auth-github-footer">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
        <span>GitHub Repository</span>
      </a>

    </div>

  </div>

  <script src="js/svg-icons.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Pre-fill credentials if coming from signup
      try {
        const savedEmail = localStorage.getItem('stackly_auth_email');
        const savedRole = localStorage.getItem('stackly_auth_role');
        if (savedEmail) {
          const emailInput = document.getElementById('auth-email');
          if (emailInput) emailInput.value = savedEmail;
        }
        if (savedRole) {
          const roleSelect = document.getElementById('auth-role');
          if (roleSelect) roleSelect.value = savedRole;
        }
      } catch (err) {}

      // Toggle Password Visibility
      const toggleBtn = document.getElementById('toggle-password');
      const passInput = document.getElementById('auth-password');
      if (toggleBtn && passInput) {
        toggleBtn.addEventListener('click', () => {
          const isPass = passInput.type === 'password';
          passInput.type = isPass ? 'text' : 'password';
        });
      }

      // Handle Login Form Submit -> Opens Dashboard Page
      const loginForm = document.getElementById('login-form');
      loginForm?.addEventListener('submit', (e) => {
        e.preventDefault();
        const role = document.getElementById('auth-role')?.value || 'user';
        const email = document.getElementById('auth-email')?.value || '';
        
        window.showToast && window.showToast('Signing in... Loading dashboard...', 'info');
        
        setTimeout(() => {
          if (role === 'admin' || email.includes('admin')) {
            window.location.href = 'admin-dashboard.html';
          } else {
            window.location.href = 'user-dashboard.html';
          }
        }, 600);
      });
    });
  </script>
</body>
</html>
