<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - STACKLY</title>
  <meta name="description" content="Create your STACKLY account to access 500+ curated engineering masterclasses, ephemeral cloud sandboxes, and verified certificates.">

  <!-- Font Awesome 6.5.1 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="auth-page-body">

  <!-- Ambient Multi-Color Aurora Mesh Orbs & Overlay -->
  <div class="ambient-aurora-container" style="opacity: 0.6;">
    <div class="aurora-orb aurora-orb-violet"></div>
    <div class="aurora-orb aurora-orb-cyan"></div>
    <div class="aurora-orb aurora-orb-coral"></div>
  </div>
  <div class="cyber-grid-overlay" style="opacity: 0.5;"></div>

  <!-- Interactive Constellation Canvas -->
  <canvas id="constellation-canvas"></canvas>

  <div class="auth-split-card slide-up-reveal">
    
    <!-- Left Visual Side -->
    <div class="auth-visual-side">
      <img src="images/signup_elearn_theme.webp" alt="Global E-Learning Platform &amp; Community" class="auth-visual-bg-img" />
      <div class="auth-visual-overlay"></div>
      
      <div class="auth-visual-content">
        <h2 class="auth-visual-title">
          Start your learning<br>journey with Stackly.
        </h2>
        <p class="auth-visual-desc">
          Access 500+ interactive courses, cloud sandboxes, and 1-on-1 expert mentorship.
        </p>
      </div>
    </div>

    <!-- Right Form Side -->
    <div class="auth-form-side">
      
      <!-- Back to Home -->
      <div class="auth-back-nav">
        <a href="index.html" class="auth-back-pill">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Back to Home</span>
        </a>
      </div>

      <!-- Brand Logo & Heading -->
      <div class="auth-brand-head">
        <a href="index.html">
          <img src="images/stackly-logo.webp" alt="STACKLY" />
        </a>
        <h1 class="auth-form-heading">Create your own account</h1>
        <p class="auth-form-subtext">Stackly is here to support your recruitment needs every step of the way.</p>
      </div>

      <!-- Form -->
      <form id="signup-form">
        
        <div class="auth-field-group">
          <label class="auth-field-label">Name *</label>
          <input type="text" id="signup-name" required placeholder="Enter your full name" class="auth-field-input" />
        </div>

        <div class="auth-field-group">
          <label class="auth-field-label">Email *</label>
          <input type="email" id="signup-email" required placeholder="name@company.com" class="auth-field-input" />
        </div>

        <div class="auth-field-group">
          <label class="auth-field-label">Password *</label>
          <div class="auth-password-box">
            <input type="password" id="signup-password" required placeholder="••••••••" class="auth-field-input" />
            <button type="button" class="auth-eye-toggle" id="toggle-signup-password" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="auth-field-group">
          <label class="auth-field-label">Re-enter password *</label>
          <div class="auth-password-box">
            <input type="password" id="signup-repassword" required placeholder="••••••••" class="auth-field-input" />
            <button type="button" class="auth-eye-toggle" id="toggle-signup-repassword" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="auth-field-group">
          <label class="auth-field-label">Role *</label>
          <select id="signup-role" class="auth-field-select" required>
            <option value="" disabled>Select your role</option>
            <option value="user" selected>User (Learner)</option>
            <option value="admin">Admin (Administrator)</option>
          </select>
        </div>

        <!-- Terms Checkbox -->
        <div style="margin: 0.9rem 0 1.3rem; font-size: 0.84rem;">
          <label class="auth-checkbox-label">
            <input type="checkbox" id="agree-terms" required />
            <span>I have read and agree to the <a href="#" class="auth-link-red" onclick="window.showToast && window.showToast('Terms and Conditions: Standard academic & sandbox agreement.', 'info'); return false;">Terms and conditions</a></span>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="auth-btn-dark">
          Create account
        </button>

      </form>

      <!-- Switch to Sign In -->
      <div class="auth-footer-switch">
        <span>Already have an account?</span>
        <a href="login.html" class="auth-link-red">Sign In</a>
      </div>

      <!-- GitHub Link -->
      <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="auth-github-footer">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
        <span>GitHub Repository</span>
      </a>

    </div>

  </div>

  <script src="js/svg-icons.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Toggle Password Visibility
      const setupToggle = (btnId, inputId) => {
        const btn = document.getElementById(btnId);
        const input = document.getElementById(inputId);
        if (btn && input) {
          btn.addEventListener('click', () => {
            input.type = input.type === 'password' ? 'text' : 'password';
          });
        }
      };

      setupToggle('toggle-signup-password', 'signup-password');
      setupToggle('toggle-signup-repassword', 'signup-repassword');

      // Handle Sign Up Form Submit -> Redirects to Login / Sign In page
      const signupForm = document.getElementById('signup-form');
      signupForm?.addEventListener('submit', (e) => {
        e.preventDefault();
        const p1 = document.getElementById('signup-password')?.value;
        const p2 = document.getElementById('signup-repassword')?.value;
        if (p1 && p2 && p1 !== p2) {
          window.showToast && window.showToast('Passwords do not match. Please verify.', 'error');
          return;
        }

        const name = document.getElementById('signup-name')?.value || '';
        const email = document.getElementById('signup-email')?.value || '';
        const role = document.getElementById('signup-role')?.value || 'user';
        
        try {
          if (name) localStorage.setItem('stackly_auth_name', name);
          localStorage.setItem('stackly_auth_email', email);
          localStorage.setItem('stackly_auth_role', role);
        } catch (err) {}

        window.showToast && window.showToast('Account created successfully! Redirecting to Sign In...', 'success');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 700);
      });
    });
  </script>
</body>
</html>
