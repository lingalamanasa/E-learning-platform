<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an account - STACKLY</title>
  <meta name="description" content="Sign up for STACKLY and get a 30-day free trial to explore AI-guided learning, cloud sandboxes, and expert mentorship.">

  <!-- Font Awesome 6.5.1 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css?v=widegap4.0">
  <link rel="stylesheet" href="css/animations.css?v=clean1.0">
  <link rel="stylesheet" href="css/components.css?v=clean1.0">
  <link rel="stylesheet" href="css/auth-modern.css?v=card1.0">
</head>
<body class="auth-page-body">

  <div class="auth-ambient-glow"></div>

  <!-- Main Floating Auth Card -->
  <main class="auth-split-card anim-zoom-in" id="authCard">
    
    <!-- Left Column: Form Side -->
    <section class="auth-form-side">
      
      <!-- Top Navigation: Brand Pill & Back to Home Button -->
      <div class="auth-top-nav-bar">
        <a href="index.html" class="auth-brand-pill" title="STACKLY Home">
          <img src="images/stackly-logo.webp" alt="STACKLY Logo" class="auth-pill-logo" onerror="this.src='stackly-logo.webp'" />
        </a>

        <a href="index.html" class="auth-home-btn" id="btnBackToHome">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Back to home</span>
        </a>
      </div>

      <!-- Header (Exact Match to Mockup) -->
      <div class="auth-header-block">
        <h1 class="auth-main-title">Create an account</h1>
        <p class="auth-main-subtitle">Sing up and get 30 day free trial</p>
      </div>

      <!-- Form -->
      <form id="signup-form" class="auth-inner-form" action="login.html" novalidate>
        
        <div class="auth-field-group">
          <label for="signup-name" class="auth-field-label">Username / Full Name</label>
          <input 
            type="text" 
            id="signup-name" 
            name="name" 
            required 
            placeholder="Enter your name or username" 
            class="auth-field-input" 
            autocomplete="name"
          />
        </div>

        <div class="auth-field-group">
          <label for="signup-email" class="auth-field-label">Email</label>
          <input 
            type="email" 
            id="signup-email" 
            name="email" 
            required 
            placeholder="Enter your email address" 
            class="auth-field-input" 
            autocomplete="email"
          />
        </div>

        <div class="auth-field-group">
          <label for="signup-password" class="auth-field-label">Password</label>
          <div class="auth-password-wrapper">
            <input 
              type="password" 
              id="signup-password" 
              name="password" 
              required 
              placeholder="Enter your password" 
              class="auth-field-input" 
              autocomplete="new-password"
            />
            <button type="button" class="auth-eye-btn" id="toggle-signup-password" aria-label="Toggle password visibility">
              <i class="fa-regular fa-eye-slash" id="eye-icon-signup"></i>
            </button>
          </div>
        </div>

        <div class="auth-field-group">
          <label for="signup-confirm-password" class="auth-field-label">Confirm Password</label>
          <div class="auth-password-wrapper">
            <input 
              type="password" 
              id="signup-confirm-password" 
              name="confirmPassword" 
              required 
              placeholder="Confirm your password" 
              class="auth-field-input" 
              autocomplete="new-password"
            />
            <button type="button" class="auth-eye-btn" id="toggle-signup-confirm-password" aria-label="Toggle confirm password visibility">
              <i class="fa-regular fa-eye-slash" id="eye-icon-signup-confirm"></i>
            </button>
          </div>
          <div id="signup-password-match-error" style="display: none; font-size: 0.8rem; margin-top: 0.35rem; font-weight: 500;"></div>
        </div>

        <div class="auth-field-group">
          <label for="signup-role" class="auth-field-label">Role</label>
          <select id="signup-role" name="role" class="auth-field-select" required>
            <option value="user" selected>Learner (User Dashboard)</option>
            <option value="admin">Administrator (Admin Studio)</option>
          </select>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="auth-submit-btn" id="btnSubmitSignup">
          <span>Submit</span>
        </button>

        <!-- Social Auth Buttons -->
        <div class="auth-social-row">
          <a href="https://github.com/lingalamanasa/E-learning-platform" target="_blank" rel="noopener noreferrer" class="auth-social-btn" style="text-decoration: none; justify-content: center; display: inline-flex; align-items: center;">
            <i class="fa-brands fa-github"></i>
            <span>GitHub</span>
          </a>
          
          <a href="404.html" class="auth-social-btn" style="text-decoration: none; justify-content: center; display: inline-flex; align-items: center;">
            <svg width="15" height="15" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
            <span>Google</span>
          </a>
        </div>

      </form>

      <!-- Bottom Nav Links -->
      <div class="auth-bottom-links" style="justify-content: center; text-align: center;">
        <span>Have any account? <a href="login.html">Sign in</a></span>
      </div>

      <div style="text-align: center; margin-top: 0.65rem;">
        <a href="https://github.com/lingalamanasa/E-learning-platform" target="_blank" rel="noopener noreferrer" class="auth-github-footer" style="display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem; font-size: 0.82rem; color: #71717a; text-decoration: none;">
          <i class="fa-brands fa-github"></i>
          <span>GitHub Repository</span>
        </a>
      </div>

    </section>

    <!-- Right Column: Visual Side with Floating Widgets -->
    <section class="auth-visual-side">
      
      <!-- Top Right Close / Home Button -->
      <a href="index.html" class="auth-close-circle-btn" title="Back to home">
        <i class="fa-solid fa-xmark"></i>
      </a>

      <!-- Background Photograph -->
      <img 
        src="images/auth_team_collab.jpg" 
        alt="Creative tech team collaborating on Stackly cloud platform" 
        class="auth-visual-hero-img" 
      />

      <!-- Floating Widget 1: Top Yellow Sticky Note -->
      <div class="auth-widget-sticky-task">
        <div class="auth-task-card-yellow">
          <div class="auth-task-title">
            <span>Task Review With Team</span>
            <span class="auth-task-dot-black"></span>
          </div>
          <span class="auth-task-time">09:30am–10:00am</span>
        </div>
        <div class="auth-task-pill-dark">
          <span>09:30am–10:00am</span>
          <span class="dot-yellow"></span>
        </div>
      </div>

      <!-- Floating Widget 2: Team Member Avatar Cluster -->
      <div class="auth-widget-avatars" aria-label="Active team members">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&h=120&q=80" alt="Sarah Miller" class="auth-avatar-bubble" />
        <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=120&h=120&q=80" alt="Elena Vance" class="auth-avatar-bubble" />
        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=120&h=120&q=80" alt="Marcus Chen" class="auth-avatar-bubble" />
      </div>

      <!-- Floating Widget 3: Glassmorphic Weekly Calendar Strip -->
      <div class="auth-widget-calendar-strip" aria-label="Schedule calendar">
        <div class="auth-cal-col">
          <span class="auth-cal-day">Sun</span>
          <span class="auth-cal-num">22</span>
        </div>
        <div class="auth-cal-col">
          <span class="auth-cal-day">Mon</span>
          <span class="auth-cal-num">23</span>
        </div>
        <div class="auth-cal-col">
          <span class="auth-cal-day">Tue</span>
          <span class="auth-cal-num">24</span>
        </div>
        <div class="auth-cal-col active-wed">
          <span class="auth-cal-day">Wed</span>
          <span class="auth-cal-num">25</span>
        </div>
        <div class="auth-cal-col">
          <span class="auth-cal-day">Thu</span>
          <span class="auth-cal-num">26</span>
        </div>
        <div class="auth-cal-col">
          <span class="auth-cal-day">Fri</span>
          <span class="auth-cal-num">27</span>
        </div>
        <div class="auth-cal-col">
          <span class="auth-cal-day">Sat</span>
          <span class="auth-cal-num">28</span>
        </div>
        <div class="auth-cal-hatch-pattern" aria-hidden="true"></div>
      </div>

      <!-- Floating Widget 4: Bottom Daily Meeting White Card -->
      <div class="auth-widget-meeting-card">
        <div class="auth-meeting-header">
          <span class="auth-meeting-title">Daily Meeting</span>
          <span class="auth-meeting-dot-yellow"></span>
        </div>
        <div class="auth-meeting-time">12:00pm–01:00pm</div>
        <div class="auth-meeting-avatar-stack">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=80&h=80&q=80" alt="Member 1" class="auth-attendee-avatar" />
          <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=80&h=80&q=80" alt="Member 2" class="auth-attendee-avatar" />
          <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=80&h=80&q=80" alt="Member 3" class="auth-attendee-avatar" />
          <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=80&h=80&q=80" alt="Member 4" class="auth-attendee-avatar" />
        </div>
      </div>

    </section>

  </main>

  <script src="js/svg-icons.js"></script>
  <script src="js/app.js"></script>
  <script>
    function handleSocialAuth(provider) {
      if (window.showToast) {
        window.showToast(`${provider} signup connected! Setting up your 30-day trial...`, 'success');
      }
      setTimeout(() => {
        window.location.href = 'user-dashboard.html';
      }, 700);
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Responsive role option labels to prevent mobile overflow
      const roleSelect = document.getElementById('signup-role');
      function adjustRoleLabels() {
        if (!roleSelect) return;
        const isMobile = window.innerWidth <= 640;
        const optUser = roleSelect.querySelector('option[value="user"]');
        const optAdmin = roleSelect.querySelector('option[value="admin"]');
        if (optUser) {
          optUser.textContent = isMobile ? 'Learner' : 'Learner (User Dashboard)';
        }
        if (optAdmin) {
          optAdmin.textContent = isMobile ? 'Administrator' : 'Administrator (Admin Studio)';
        }
      }
      adjustRoleLabels();
      window.addEventListener('resize', adjustRoleLabels);

      // Toggle Password Visibility
      const toggleBtn = document.getElementById('toggle-signup-password');
      const passInput = document.getElementById('signup-password');
      const eyeIcon = document.getElementById('eye-icon-signup');
      if (toggleBtn && passInput) {
        toggleBtn.addEventListener('click', () => {
          const isPass = passInput.type === 'password';
          passInput.type = isPass ? 'text' : 'password';
          if (eyeIcon) {
            eyeIcon.className = isPass ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
          }
        });
      }

      // Toggle Confirm Password Visibility
      const toggleConfirmBtn = document.getElementById('toggle-signup-confirm-password');
      const confirmPassInput = document.getElementById('signup-confirm-password');
      const eyeIconConfirm = document.getElementById('eye-icon-signup-confirm');
      if (toggleConfirmBtn && confirmPassInput) {
        toggleConfirmBtn.addEventListener('click', () => {
          const isPass = confirmPassInput.type === 'password';
          confirmPassInput.type = isPass ? 'text' : 'password';
          if (eyeIconConfirm) {
            eyeIconConfirm.className = isPass ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
          }
        });
      }

      // Live match check indicator
      const matchMsg = document.getElementById('signup-password-match-error');
      function checkPasswordsMatch() {
        if (!confirmPassInput || !passInput || !matchMsg) return;
        if (!confirmPassInput.value) {
          matchMsg.style.display = 'none';
          return;
        }
        if (passInput.value === confirmPassInput.value) {
          matchMsg.style.display = 'block';
          matchMsg.style.color = '#10b981';
          matchMsg.textContent = '✓ Passwords match';
        } else {
          matchMsg.style.display = 'block';
          matchMsg.style.color = '#fb7185';
          matchMsg.textContent = 'Passwords do not match';
        }
      }
      passInput?.addEventListener('input', checkPasswordsMatch);
      confirmPassInput?.addEventListener('input', checkPasswordsMatch);

      // Handle Sign Up Form Submit -> Redirects to Login
      const signupForm = document.getElementById('signup-form');
      const submitSignupBtn = document.getElementById('btnSubmitSignup');

      function processSignupAndRedirect(e) {
        if (e) e.preventDefault();
        const name = document.getElementById('signup-name')?.value.trim() || '';
        const email = document.getElementById('signup-email')?.value.trim() || '';
        const role = document.getElementById('signup-role')?.value || 'user';
        const password = passInput?.value || '';
        const confirmPassword = confirmPassInput?.value || '';

        if (!name || !email || !password) {
          if (window.showToast) {
            window.showToast('Please fill in all required fields.', 'error');
          }
          return;
        }

        if (confirmPassword && password !== confirmPassword) {
          if (matchMsg) {
            matchMsg.style.display = 'block';
            matchMsg.style.color = '#fb7185';
            matchMsg.textContent = 'Passwords do not match. Please re-enter.';
          }
          if (window.showToast) {
            window.showToast('Passwords do not match. Please verify your confirm password.', 'error');
          }
          confirmPassInput?.focus();
          return;
        }
        
        try {
          if (name) {
            localStorage.setItem('stackly_auth_name', name);
            localStorage.setItem('stackly_auth_username', name);
          }
          if (email) {
            localStorage.setItem('stackly_auth_email', email);
          }
          localStorage.setItem('stackly_auth_role', role);
        } catch (err) {}

        if (window.showToast) {
          const roleDisplay = role === 'admin' ? 'Administrator' : 'Learner';
          window.showToast(`Account created as ${roleDisplay} for ${name || 'user'}! Redirecting to login...`, 'success');
        }

        setTimeout(() => {
          window.location.href = 'login.html';
        }, 500);
      }

      signupForm?.addEventListener('submit', processSignupAndRedirect);
      submitSignupBtn?.addEventListener('click', (e) => {
        if (!signupForm) {
          processSignupAndRedirect(e);
        }
      });
    });
  </script>
</body>
</html>
